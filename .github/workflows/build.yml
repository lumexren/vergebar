name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libglib2.0-dev libwayland-dev wayland-protocols meson ninja-build pkg-config build-essential
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git
          meson setup gtk4-layer-shell/build gtk4-layer-shell --prefix=/usr -Dexamples=false -Dtests=false -Dintrospection=false -Dvapi=false
          sudo ninja -C gtk4-layer-shell/build install
          sudo ldconfig

      - name: Read Zig Version
        id: zig_version
        run: echo "version=$(tr -d ' \n\r' < .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig_version.outputs.version }}

      - name: Run Tests
        run: zig build test

      - name: Build debug
        run: |
          zig build
          mv zig-out/bin zig-out-debug

      - name: Build release
        run: |
          zig build -Doptimize=small
          mv zig-out/bin zig-out-release

      - name: Set Version
        id: version
        run: |
          SEMVER=$(grep -oP '\.version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' build.zig.zon)
          if [ -z "$SEMVER" ]; then
            echo "Error: Version not found in build.zig.zon"
            exit 1
          fi

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$REF_NAME" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            CLEAN_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
            VERSION="${SEMVER}-${CLEAN_REF}.${{ github.run_id }}"
          else
            VERSION="${SEMVER}.${{ github.run_id }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Debug Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-debug-${{ steps.version.outputs.version }}
          path: zig-out-debug/*
          retention-days: 14

      - name: Upload Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-release-${{ steps.version.outputs.version }}
          path: zig-out-release/*
          retention-days: 14
